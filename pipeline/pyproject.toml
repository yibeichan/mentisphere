[project]
name = "mentisphere-pipeline"
version = "0.1.0"
description = "Data pipeline for MentiSphere: license-gated source manifest and build checks"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.4,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
menti-pipeline = "mentisphere_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mentisphere_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
