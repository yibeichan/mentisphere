name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily remote build at 09:17 UTC.
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    # Playwright 1.60.x cannot install Chromium on Ubuntu 26.04 (ubuntu-latest).
    # Drop this pin once @playwright/test is at 1.61 or later.
    runs-on: ubuntu-24.04
    # The Playwright step runs apt, which can stall; fail fast instead of waiting for the 6 h default.
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck --workspace=frontend

      - name: Lint
        run: npm run lint --workspace=frontend

      - name: Build
        run: npm run build --workspace=frontend

      - name: End-to-end smoke tests
        run: npm run test:e2e --workspace=frontend

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Test API
        working-directory: backend
        run: python -m pytest

  guard:
    name: Data guard and source manifest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Check tracked files for data and leaks
        run: uv run --python 3.12 scripts/check_no_data_files.py

      - name: Test data guard
        run: uv run --python 3.12 --with pytest pytest scripts/tests -v

      - name: Test pipeline
        working-directory: pipeline
        run: uv run --locked pytest -v

      - name: Check source manifest
        working-directory: pipeline
        run: uv run --locked menti-pipeline check-sources sources.yaml
